[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchard-warden"
version = "0.1.0a1"
description = "Multi-layer iOS integrity checks for people targeted by mercenary spyware (alpha)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ios", "forensics", "spyware", "pegasus", "mvt", "journalists", "dfir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["pyyaml>=6", "cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "build>=1"]

[project.scripts]
orchardwarden = "orchardwarden.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"orchardwarden.kits" = ["cards/*.yaml"]
"orchardwarden.correlate" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
